# Example only — not required in MoneyGap AI app CI
name: MoneyGap CLI
on:
  push:
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CLI
        run: |
          cd packages/moneygap-cli
          npm ci || npm install
          npm run build
          npm link
      - name: Scan
        run: moneygap scan
        working-directory: .
